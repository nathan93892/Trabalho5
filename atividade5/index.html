<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Trocar Cor</title>
    <style>
        body {
            margin: 20px;
            background-color: white;
        }
        .fundo-azul {
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <button onclick="trocarCor()">Trocar Cor</button>
    <script>
        function trocarCor() {
            document.body.classList.toggle('fundo-azul');
        }
    </script>
</body>
</html>
